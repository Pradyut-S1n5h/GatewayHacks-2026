<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnNext - Student Report & Roadmap</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc; 
            padding: 30px; 
        }
        .container { 
            max-width: 800px; 
            margin: auto; 
            background: #1e293b; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
        }
        button { 
            background: #6366f1; 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
        }
        button:hover { 
            background: #4f46e5; 
        }
        #output { 
            margin-top: 20px; 
            background: #0f172a; 
            padding: 20px; 
            border-radius: 6px; 
            white-space: pre-wrap; 
            font-family: monospace; 
            max-height: 400px; 
            overflow-y: auto;
            color: #38bdf8;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>LearnNext Dashboard</h1>
        <p>Click below to generate and view the student report and roadmap via the FastAPI backend[span_0](start_span)[span_0](end_span):</p>
        
        <button onclick="fetchStudentReport()">Generate Student Report & Roadmap</button>
        
        <div id="output">Report and roadmap data will appear here...</div>
    </div>

    <!-- Link your frontend JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
